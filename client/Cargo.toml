[package]
name = "realm-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
realm-shared = { path = "../shared" }
wasm-bindgen = "=0.2.130"
js-sys = "0.3.107"
console_error_panic_hook = "0.1"
serde_json = "1"

[dependencies.web-sys]
version = "0.3.107"
features = [
  "Window", "Document", "Element", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "KeyboardEvent", "MouseEvent",
  "WheelEvent", "EventTarget", "Performance", "WebSocket",
  "MessageEvent", "BinaryType", "console", "CssStyleDeclaration", "DomRect", "CanvasGradient", "CanvasPattern", "ImageData", "HtmlImageElement", "Location"
]
